name: Publish verified Android 1.1.1
on:
  push:
    branches: ['binary-upload-1-1-1-*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify APK
        run: |
          cat .release-upload/part-* > rhythm-android-1.1.1.apk
          echo 'c49411bffe616cb0618b1b81deed82252535a30ead11c437312eb3ef84692527  rhythm-android-1.1.1.apk' > SHA256SUMS-1.1.1.txt
          sha256sum -c SHA256SUMS-1.1.1.txt
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --retry 3 --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Content-Type: application/octet-stream" --data-binary @rhythm-android-1.1.1.apk "https://uploads.github.com/repos/hahaker/rhythm-app-releases/releases/424289934/assets?name=rhythm-android-1.1.1.apk" > /tmp/rhythm-android-1.1.1.apk.json
          curl --fail --silent --show-error --retry 3 --request POST --header "Authorization: Bearer $GH_TOKEN" --header "Content-Type: application/octet-stream" --data-binary @SHA256SUMS-1.1.1.txt "https://uploads.github.com/repos/hahaker/rhythm-app-releases/releases/424289934/assets?name=SHA256SUMS-1.1.1.txt" > /tmp/SHA256SUMS-1.1.1.txt.json
          gh api --method PATCH repos/hahaker/rhythm-app-releases/releases/424289934 -F draft=false -F prerelease=true --silent

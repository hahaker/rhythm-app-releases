name: Publish verified Android 1.1.6
on:
  push:
    branches: ['binary-upload-1-1-6-*']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Assemble and verify APK
        run: |
          cat .release-upload/part-* > delta.json.gz
          curl --fail --silent --show-error --location --retry 2 --max-time 120 'https://github.com/hahaker/rhythm-app-releases/releases/download/v1.1.5/rhythm-android-1.1.5.apk' > base.apk
          python3 - <<'PYRESTORE'
          import base64,gzip,hashlib,json
          from pathlib import Path
          patch=json.loads(gzip.decompress(Path('delta.json.gz').read_bytes()))
          base=Path('base.apk').read_bytes()
          assert hashlib.sha256(base).hexdigest()==patch['baseSHA256']
          result=b''.join(base64.b64decode(op['data'],validate=True) if 'data' in op else base[op['offset']:op['offset']+op['length']] for op in patch['operations'])
          assert hashlib.sha256(result).hexdigest()==patch['targetSHA256']=='342f32361c693bc0f898f699c8f71421a8be85c0de844cbf4839da15265ab48e'
          Path('rhythm-android-1.1.6.apk').write_bytes(result)
          PYRESTORE
          echo '342f32361c693bc0f898f699c8f71421a8be85c0de844cbf4839da15265ab48e  rhythm-android-1.1.6.apk' > SHA256SUMS-1.1.6.txt
          sha256sum -c SHA256SUMS-1.1.6.txt
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 180 -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: application/octet-stream' --data-binary @rhythm-android-1.1.6.apk 'https://uploads.github.com/repos/hahaker/rhythm-app-releases/releases/426000343/assets?name=rhythm-android-1.1.6.apk' > /dev/null
          curl --fail --silent --show-error --retry 2 --retry-all-errors --max-time 60 -H "Authorization: Bearer $GH_TOKEN" -H 'Content-Type: text/plain' --data-binary @SHA256SUMS-1.1.6.txt 'https://uploads.github.com/repos/hahaker/rhythm-app-releases/releases/426000343/assets?name=SHA256SUMS-1.1.6.txt' > /dev/null
          gh api --method PATCH repos/hahaker/rhythm-app-releases/releases/426000343 -F draft=false -F prerelease=true --silent
